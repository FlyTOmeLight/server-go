  helloworldv1.ListModuleRequest:
    properties:
      filter:
        description: 搜索内容
        example: name-1
        maxLength: 100
        type: string
      order:
        description: |-
          排序规则: asc: 升序, desc: 倒序, 默认倒序

          Example: desc
        enum:
        - asc
        - desc
        type: string
      orderBy:
        description: |-
          排序依据

          Example: name
        type: string
      orders:
        description: |-
          mongo 排序规则

          Example: []string{ "{order: desc}", "{id:asc}" }
        example:
        - '[{create_ad:desc}'
        - '{id:asc}]'
        items:
          type: string
        type: array
      pageNo:
        description: |-
          页码

          Example: 1
        type: integer
      pageSize:
        description: |-
          每页的大小

          Example: 10
        maximum: 200
        type: integer
      projectID:
        description: 项目ID
        example: project1
        maxLength: 20
        type: string
    type: object
  helloworldv1.ListModuleResponse:
    properties:
      result:
        description: 当前页结果
        items:
          $ref: '#/definitions/helloworldv1.Module'
        type: array
      totalCount:
        description: 总数
        example: 10
        type: integer
    type: object
  helloworldv1.Module:
