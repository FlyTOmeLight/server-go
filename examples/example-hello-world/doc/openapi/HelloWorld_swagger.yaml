      name:
        description: 名称
        example: name-1
        type: string
      projectID:
        description: 项目ID
        example: project1
        type: string
      updatedAt:
        description: 更新时间
        type: string
      userID:
        description: 用户ID
        example: user1
        type: string
    type: object
  helloworldv1.UpdateModuleRequest:
    properties:
      description:
        description: 描述
        example: this is a description
        maxLength: 200
        type: string
      id:
        example: id1
        maxLength: 20
        type: string
    required:
    - id
    type: object
