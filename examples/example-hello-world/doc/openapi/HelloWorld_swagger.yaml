basePath: /helloworld/internal
definitions:
  errors.Error:
    properties:
      code:
        description: Code 错误码
        type: string
      message:
        description: Message 详细错误信息
        type: string
      requestId:
        description: RequestID 请求id，接收到请求的时候由中间件自动注入
        type: string
      statusCode:
        description: StatusCode 状态码，推荐6位数字
        type: integer
    type: object
  helloworldv1.CreateModuleRequest:
    properties:
      description:
        description: 描述
        maxLength: 200
        type: string
      name:
        description: 名称
        example: name-1
        maxLength: 32
        type: string
      projectID:
        description: 项目ID
        example: project1
        maxLength: 20
        type: string
    required:
    - name
    - projectID
    type: object
  helloworldv1.CreateModuleResponse:
    properties:
      createdAt:
        description: 创建时间
        type: string
      description:
        description: 描述
        example: this is a description
        type: string
      id:
        description: ID,唯一标识
        example: id1
        type: string
      name:
        description: 名称
        example: name-1
        type: string
      projectID:
        description: 项目ID
        example: project1
        type: string
      updatedAt:
        description: 更新时间
        type: string
      userID:
        description: 用户ID
        example: user1
        type: string
    type: object
  helloworldv1.DeleteModuleRequest:
    properties:
      id:
        example: id1
        maxLength: 20
        type: string
    required:
    - id
    type: object
  helloworldv1.GetModuleRequest:
    properties:
      id:
        example: id1
        maxLength: 20
        type: string
    required:
    - id
    type: object
  helloworldv1.GetModuleResponse:
    properties:
      createdAt:
        description: 创建时间
        type: string
      description:
        description: 描述
        example: this is a description
        type: string
      id:
        description: ID,唯一标识
        example: id1
        type: string
      name:
        description: 名称
        example: name-1
        type: string
      projectID:
        description: 项目ID
        example: project1
        type: string
      updatedAt:
        description: 更新时间
        type: string
      userID:
        description: 用户ID
        example: user1
        type: string
    type: object
  helloworldv1.ListModuleRequest:
    properties:
      filter:
        description: 搜索内容
        example: name-1
        maxLength: 100
        type: string
      order:
        default: desc
        description: |-
          排序规则: asc: 升序, desc: 倒序, 默认倒序

          Example: desc
        enum:
        - asc
        - desc
        type: string
      orderBy:
        description: |-
          排序依据

          Example: name
        type: string
      orders:
        description: |-
          mongo 排序规则

          Example: []string{ "{order: desc}", "{id:asc}" }
        example:
        - '[{create_ad:desc}'
        - '{id:asc}]'
        items:
          type: string
        type: array
      pageNo:
        default: 1
        description: |-
          页码

          Example: 1
        minimum: 0
        type: integer
      pageSize:
        default: 20
        description: |-
          每页的大小

          Example: 10
        maximum: 200
        minimum: 0
        type: integer
      projectID:
        description: 项目ID
        example: project1
        maxLength: 20
        type: string
    type: object
  helloworldv1.ListModuleResponse:
    properties:
      result:
        description: 当前页结果
        items:
          $ref: '#/definitions/helloworldv1.Module'
        type: array
      totalCount:
        description: 总数
        example: 10
        type: integer
    type: object
  helloworldv1.Module:
    properties:
      createdAt:
        description: 创建时间
        type: string
      description:
        description: 描述
        example: this is a description
        type: string
      id:
        description: ID,唯一标识
        example: id1
        type: string
      name:
        description: 名称
        example: name-1
        type: string
      projectID:
        description: 项目ID
        example: project1
        type: string
      updatedAt:
        description: 更新时间
        type: string
      userID:
        description: 用户ID
        example: user1
        type: string
    type: object
  helloworldv1.UpdateModuleRequest:
    properties:
      description:
        description: 描述
        example: this is a description
        maxLength: 200
        type: string
        x-nullable: true
      id:
        example: id1
        maxLength: 20
        type: string
    required:
    - id
    type: object
info:
  contact: {}
  title: HelloWorldService OpenAPI
paths:
  /v1/CreateModule:
    post:
      consumes:
      - application/json
      description: 创建模块并返回新建记录。JSON 请求体最大为 1 MiB。
      operationId: CreateModule
      parameters:
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helloworldv1.CreateModuleRequest'
      - description: 可选幂等标识；有已验证身份时，同一路由及相同参数重放已成功响应
        in: query
        name: clientToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功的模块
          schema:
            $ref: '#/definitions/helloworldv1.CreateModuleResponse'
        "400":
          description: JSON 或请求参数不符合契约
          schema:
            $ref: '#/definitions/errors.Error'
        "408":
          description: 等待幂等请求时取消或超时
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 同一幂等标识的请求参数不同
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: JSON 请求体超过 1 MiB
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: 幂等执行暂不可用
          schema:
            $ref: '#/definitions/errors.Error'
      summary: 创建示例模块
      tags:
      - Module
  /v1/DeleteModule:
    post:
      consumes:
      - application/json
      description: 按 ID 删除模块；不存在时返回 404。成功返回 200，响应体为空。
      operationId: DeleteModule
      parameters:
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helloworldv1.DeleteModuleRequest'
      - description: 可选幂等标识；有已验证身份时，同一路由及相同参数重放已成功响应
        in: query
        name: clientToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 操作完成，响应体为空
        "400":
          description: JSON 或请求参数不符合契约
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 模块不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "408":
          description: 等待幂等请求时取消或超时
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 同一幂等标识的请求参数不同
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: JSON 请求体超过 1 MiB
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: 幂等执行暂不可用
          schema:
            $ref: '#/definitions/errors.Error'
      summary: 删除示例模块
      tags:
      - Module
  /v1/GetModule:
    post:
      consumes:
      - application/json
      description: 按 ID 获取模块；不存在时返回 404。
      operationId: GetModule
      parameters:
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helloworldv1.GetModuleRequest'
      - description: 可选幂等标识；有已验证身份时，同一路由及相同参数重放已成功响应
        in: query
        name: clientToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 模块详情
          schema:
            $ref: '#/definitions/helloworldv1.GetModuleResponse'
        "400":
          description: JSON 或请求参数不符合契约
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 模块不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "408":
          description: 等待幂等请求时取消或超时
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 同一幂等标识的请求参数不同
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: JSON 请求体超过 1 MiB
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: 幂等执行暂不可用
          schema:
            $ref: '#/definitions/errors.Error'
      summary: 获取示例模块详细信息
      tags:
      - Module
  /v1/ListModule:
    post:
      consumes:
      - application/json
      description: 按项目和关键词筛选模块并返回总数与当前页。默认 pageNo=1、pageSize=20，pageSize 最大为 200；query
        分页参数覆盖请求体中的同名字段。
      operationId: ListModule
      parameters:
      - description: JSON 请求
        in: body
        name: request
        schema:
          $ref: '#/definitions/helloworldv1.ListModuleRequest'
      - description: 可选幂等标识；有已验证身份时，同一路由及相同参数重放已成功响应
        in: query
        name: clientToken
        type: string
      - default: 1
        description: 页码；0 使用默认页码
        in: query
        minimum: 0
        name: pageNo
        type: integer
      - default: 20
        description: 每页条数；0 使用默认大小
        in: query
        maximum: 200
        minimum: 0
        name: pageSize
        type: integer
      - default: desc
        description: 排序方向
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: 排序字段
        in: query
        name: orderBy
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 模块列表与总数
          schema:
            $ref: '#/definitions/helloworldv1.ListModuleResponse'
        "400":
          description: JSON 或请求参数不符合契约
          schema:
            $ref: '#/definitions/errors.Error'
        "408":
          description: 等待幂等请求时取消或超时
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 同一幂等标识的请求参数不同
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: JSON 请求体超过 1 MiB
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: 幂等执行暂不可用
          schema:
            $ref: '#/definitions/errors.Error'
      summary: 获取示例模块列表
      tags:
      - Module
  /v1/UpdateModule:
    post:
      consumes:
      - application/json
      description: 按 ID 更新模块描述。description 未传入或为 null 时保留原值，显式空字符串清空描述。成功返回 200，响应体为空。
      operationId: UpdateModule
      parameters:
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helloworldv1.UpdateModuleRequest'
      - description: 可选幂等标识；有已验证身份时，同一路由及相同参数重放已成功响应
        in: query
        name: clientToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 操作完成，响应体为空
        "400":
          description: JSON 或请求参数不符合契约
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 模块不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "408":
          description: 等待幂等请求时取消或超时
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 同一幂等标识的请求参数不同
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: JSON 请求体超过 1 MiB
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: 幂等执行暂不可用
          schema:
            $ref: '#/definitions/errors.Error'
      summary: 更新示例模块
      tags:
      - Module
swagger: "2.0"
