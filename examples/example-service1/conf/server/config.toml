# app.toml: 应用主配置文件
AppName = "ExampleService"
AppCode = 100
RunMode = "debug"          # debug/test/release
[Feature]
Feature1 = true
Feature2 = false

[HTTPServer]
AuthType = "Fake"
# 监听地址，必填
Listen = "0.0.0.0:80"
# 读超时时间（单位ms），选填，默认20s
ReadTimeout = 60000
# 写超时时间（单位ms），选填，默认10s
WriteTimeout = 40000
# Idle超时时间（单位ms），选填，默认10s
IdleTimeout = 10000 # 10s
# 最大header空间，选填，默认100k
MaxHeaderBytes = 100000 # 100k
# 对外接口通用前缀，配置后所有接口path将默认加上该前缀，选填，默认为空
APIBasePath = "example-service1"
# 是否开启幂等校验
# 幂等超时时间
# 是否开启pprof
PprofEnable = true
# 是否开启swagger接口
SwaggerEnable = true
UseH2C = true

# 鉴权插件，参数不传或列表为空默认注入Fake插件。支持以下三种。
# Fake和其他插件互斥，配置Fake不可配置其他插件，否则报错
# Fake: 伪鉴权，根据FakeAuth配置自定义用户信息
# Authorization: AK,SK鉴权
# Session: 会话认证
# APIKey: APIKey 鉴权
# AuthPlugins = ["Fake"]
AuthPlugins = [
    "Authorization",
    "Session",
    "APIKey",
]

[HTTPServer.Trace]
# 根据接口前缀过滤，符合条件的接口不开启trace log
PrefixFilters = ["/examples", "/assets"]
# 根据接口后缀过滤，符合条件的接口不开启trace log
SuffixFilters = ["/metrics", "/ping", "/healthz"]

# 静态文件接口配置，每增加一条会新增一个接口用于获取静态文件
[[HTTPServer.Assets]]
# 接口是否开启鉴权，如果开启，具体鉴权方式由AuthPlugins配置决定
AuthEnable = false
# 接口路径，非必填，不填默认为/assets，建议这个接口关闭trace，否则日志过大
URLPath = "/assets"
# 文件目录，必填，如果字段为空这条配置将被忽略，最后新增的接口将为URLPath+该目录下的文件名，例如: /assets/*filepath
# 假设FilePath下有1.txt和2.txt两个文件，则可以通过GET /assets/1.txt 及 GET /assets/2.txt分别获取这两个文件
FilePath = "conf/logger"

# 伪鉴权配置，可选，不配会有一组默认值
[FakeAuth]
OrgID = "test-org-id"               # 可选，默认值："test-org-id"
UserID = "test-user-id"             # 可选，默认值："test-user-id"
UserName = "test-user-name"         # 可选，默认值："test-user-name"
UserRole = "test-user-role"         # 可选，默认值："test-user-role"
DepartmentID = "test-department-id" # 可选，默认值："test-department-id"



[DB]
Driver = "MySQL"                # 支持MySQL, SQLite, PostgreSQL, ClickHouse, 选填，默认为MySQL
Host = "localhost"
Port = 8449
User = "root"
Password = "${env: DB_PASSWORD:}"
DB = "example"
#可拓展的dsn params 可参考 https://github.com/go-sql-driver/mysql/blob/master/dsn.go
DSNParams = "collation=utf8mb4_unicode_ci&parseTime=true&loc=Local&parseTime=True"
ConnMaxIdleTime = 100
ConnMaxLifeTime = 100
MaxIdleConns = 10
MaxOpenConns = 10
AutoMigrate = true

[MongoDB]
Host = "127.0.0.1"
Port = 8717
User = "root"
Password = "${env: MONGODB_PASSWORD:}"
DB = "test"
Collection = "test"
InternalQueryExecMaxBlockingSortBytes = 335544320

# [SQLite]
# Driver = "SQLite" # 支持MySQL, SQLite, PostgreSQL, ClickHouse, 选填，默认为MySQL
# DB = "example.db"

[Redis]
Host = "localhost"
Port = 8366
ConnTimeOut = 1000
WriteTimeOut = 2000
ReadTimeOut = 2000
Retry = 2
Password = "${env: REDIS_PASSWORD:}"
DB = 9
PoolSizePerIP = 10
MinIdleConnsPerIP = 5

[Tenant]
Endpoint = "http://127.0.0.1:8366"

[Permission]
Endpoint = "http://127.0.0.1:8785"
