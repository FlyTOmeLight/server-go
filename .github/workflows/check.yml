name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/**/go.sum
      - name: Install Python 3 and C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential
          docker version
      - name: Install FlyTOmeLight gorgeous v0.9.0
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/go_fmt.XXXXXX")"
          trap 'rm -rf "$tool_dir"' EXIT
          git clone --depth 1 --branch v0.9.0 https://github.com/FlyTOmeLight/go_fmt.git "$tool_dir"
          test "$(git -C "$tool_dir" rev-parse HEAD)" = "9d389e31b15509ae9cbdff326499929f715db78f"
          cd "$tool_dir"
          go install ./cmd/gorgeous
      - name: Check modules and run all examples with PostgreSQL
        run: make check
