name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/**/go.sum
      - name: Install Python 3 and C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential
          docker version
      - name: Install fixed gorgeous version
        run: go install github.com/fsgo/go_fmt/cmd/gorgeous@v0.0.0-20260820125033-9c66f70bc46b
      - name: Check modules and run all examples with PostgreSQL
        run: make check
